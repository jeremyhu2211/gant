<!DOCTYPE html>
<html lang="zh-TW" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GanttPro — 專案時程管理</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════
   DESIGN TOKENS — Light & Dark
═══════════════════════════════════════════════ */
:root {
  --font-ui: 'Plus Jakarta Sans', sans-serif;
  --font-mono: 'DM Mono', monospace;

  /* Light */
  --bg-app:    #F4F2EE;
  --bg-card:   #FFFFFF;
  --bg-header: #F8F7F4;
  --bg-row-alt:#FAFAF8;
  --bg-hover:  #F2F0EC;
  --bg-child:  #FDFCFA;
  --bg-input:  #FFFFFF;

  --border:       rgba(0,0,0,.09);
  --border-mid:   rgba(0,0,0,.13);
  --border-strong:rgba(0,0,0,.20);

  --text-1: #141210;
  --text-2: #5A5650;
  --text-3: #A09A92;
  --text-inv:#FFFFFF;

  --accent:      #1E6AE1;
  --accent-soft: #EBF2FD;
  --today-c:     #D93025;
  --today-soft:  #FEF0EF;

  --stripe: rgba(0,0,0,.018);
  --shadow-sm: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.06);
  --shadow-md: 0 4px 12px rgba(0,0,0,.10), 0 2px 4px rgba(0,0,0,.06);
  --shadow-lg: 0 10px 30px rgba(0,0,0,.14), 0 4px 10px rgba(0,0,0,.08);

  --radius-sm: 5px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;

  --label-w: 260px;
  --col-w: 14;
  --row-h: 50px;
  --sub-h: 44px;
  --header-h: 56px;
}

[data-theme="dark"] {
  --bg-app:    #111110;
  --bg-card:   #1A1917;
  --bg-header: #141312;
  --bg-row-alt:#1D1C1A;
  --bg-hover:  #222120;
  --bg-child:  #171614;
  --bg-input:  #1F1E1C;

  --border:       rgba(255,255,255,.07);
  --border-mid:   rgba(255,255,255,.11);
  --border-strong:rgba(255,255,255,.18);

  --text-1: #EDEAE5;
  --text-2: #8C8880;
  --text-3: #5A5650;
  --text-inv:#111110;

  --accent:      #4C8EF0;
  --accent-soft: #1A2A40;
  --today-c:     #F0534A;
  --today-soft:  #2A1414;

  --stripe: rgba(255,255,255,.02);
  --shadow-sm: 0 1px 3px rgba(0,0,0,.3);
  --shadow-md: 0 4px 12px rgba(0,0,0,.4);
  --shadow-lg: 0 10px 30px rgba(0,0,0,.5);
}

/* ═══════════════════════════════════════════════
   RESET & BASE
═══════════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { font-size: 14px; }

body {
  font-family: var(--font-ui);
  background: var(--bg-app);
  color: var(--text-1);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  user-select: none;
  transition: background .25s, color .25s;
}

/* ═══════════════════════════════════════════════
   APP SHELL
═══════════════════════════════════════════════ */
.app { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

/* ── TOP NAV ── */
.topnav {
  height: var(--header-h);
  background: var(--bg-card);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center;
  padding: 0 20px; gap: 12px;
  flex-shrink: 0;
  z-index: 50;
}
.nav-logo {
  display: flex; align-items: center; gap: 8px;
  font-size: 15px; font-weight: 700;
  color: var(--text-1); letter-spacing: -.03em;
  margin-right: 8px;
}
.logo-mark {
  width: 28px; height: 28px; border-radius: 7px;
  background: var(--accent);
  display: flex; align-items: center; justify-content: center;
}
.logo-mark svg { width: 16px; height: 16px; fill: #fff; }
.nav-divider { width: 1px; height: 20px; background: var(--border-mid); }
.nav-title-input {
  font-family: var(--font-ui); font-size: 14px; font-weight: 600;
  background: transparent; border: none; outline: none;
  color: var(--text-1); width: 200px;
  cursor: text;
}
.nav-title-input:focus { background: var(--bg-hover); border-radius: var(--radius-sm); padding: 2px 6px; }
.nav-spacer { flex: 1; }
.nav-actions { display: flex; gap: 6px; align-items: center; }
.pill-btn {
  font-family: var(--font-ui); font-size: 12px; font-weight: 500;
  padding: 5px 12px; border-radius: 20px;
  border: 1px solid var(--border-mid); background: transparent;
  color: var(--text-2); cursor: pointer;
  transition: all .15s; white-space: nowrap;
  display: inline-flex; align-items: center; gap: 5px;
}
.pill-btn:hover { background: var(--bg-hover); border-color: var(--border-strong); color: var(--text-1); }
.pill-btn.accent { background: var(--accent); color: #fff; border-color: var(--accent); }
.pill-btn.accent:hover { opacity: .88; }
.icon-btn {
  width: 32px; height: 32px; border-radius: var(--radius-md);
  border: 1px solid var(--border); background: transparent;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: var(--text-2); font-size: 15px;
  transition: all .15s;
}
.icon-btn:hover { background: var(--bg-hover); color: var(--text-1); border-color: var(--border-mid); }
.theme-toggle-icon { transition: transform .3s; }
[data-theme="dark"] .theme-toggle-icon { transform: rotate(180deg); }

/* ── TOOLBAR ── */
.toolbar {
  height: 44px; background: var(--bg-card);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center;
  padding: 0 16px; gap: 8px;
  flex-shrink: 0;
}
.toolbar-sep { width: 1px; height: 18px; background: var(--border-mid); margin: 0 4px; }
.tb-btn {
  font-family: var(--font-ui); font-size: 12px; font-weight: 500;
  padding: 4px 10px; border-radius: 6px;
  border: 1px solid transparent; background: transparent;
  color: var(--text-2); cursor: pointer;
  transition: all .12s; white-space: nowrap;
  display: inline-flex; align-items: center; gap: 4px;
}
.tb-btn:hover { background: var(--bg-hover); color: var(--text-1); border-color: var(--border); }
.tb-btn.active { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.status-filter { display: flex; gap: 4px; }
.sf-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

/* ── MAIN AREA ── */
.main { flex: 1; overflow: hidden; display: flex; flex-direction: column; }
.gantt-wrap { flex: 1; overflow: auto; position: relative; }

/* ── GANTT GRID ── */
.gantt-inner { display: flex; flex-direction: column; min-width: max-content; }

/* ── STICKY TIMELINE HEADER ── */
.timeline-header {
  display: flex; position: sticky; top: 0; z-index: 25;
  background: var(--bg-header);
  border-bottom: 2px solid var(--border-mid);
}
.tl-label-cell {
  width: var(--label-w); flex-shrink: 0;
  border-right: 1px solid var(--border-mid);
  display: flex; align-items: flex-end; padding: 0 14px 6px;
  font-size: 10px; font-weight: 600; color: var(--text-3);
  letter-spacing: .1em; text-transform: uppercase;
  background: var(--bg-header);
  position: sticky; left: 0; z-index: 26;
}
.tl-grid { flex-shrink: 0; }
.month-strip { display: flex; border-bottom: 1px solid var(--border); }
.month-cell {
  font-family: var(--font-mono); font-size: 10px; font-weight: 500;
  color: var(--text-2); padding: 6px 7px 4px;
  border-right: 1px solid var(--border); flex-shrink: 0;
  letter-spacing: .03em;
}
.day-strip { display: flex; }
.day-cell {
  font-family: var(--font-mono); font-size: 9px;
  color: var(--text-3); text-align: center;
  flex-shrink: 0; height: 22px; line-height: 22px;
  border-right: 1px solid transparent; position: relative;
}
.day-cell.week-start { border-right-color: var(--border); }
.day-cell.is-today {
  color: var(--today-c); font-weight: 700;
}
.day-cell.is-today::after {
  content: ''; position: absolute;
  bottom: 0; left: 50%; transform: translateX(-50%);
  width: 3px; height: 3px; border-radius: 50%;
  background: var(--today-c);
}
.day-cell.is-weekend { color: var(--text-3); opacity: .55; }

/* ── BODY ROWS ── */
.gantt-body { display: flex; flex-direction: column; }

/* ── PROJECT GROUP ── */
.proj-group { display: flex; flex-direction: column; }

/* Parent row */
.parent-row {
  display: flex; align-items: stretch;
  height: var(--row-h); border-bottom: 1px solid var(--border);
  background: var(--bg-card); transition: background .1s;
}
.parent-row:hover { background: var(--bg-row-alt); }
.parent-row.selected { background: var(--accent-soft); }

/* Child row */
.child-row {
  display: flex; align-items: stretch;
  height: var(--sub-h); border-bottom: 1px solid var(--border);
  background: var(--bg-child); transition: background .1s, max-height .22s, opacity .22s;
}
.child-row:hover { background: var(--bg-hover); }

/* Children wrapper with animation */
.children-wrap {
  overflow: hidden;
  max-height: 2000px;
  transition: max-height .28s cubic-bezier(.4,0,.2,1), opacity .22s;
  opacity: 1;
}
.children-wrap.collapsed { max-height: 0; opacity: 0; }

/* ── LABEL CELL (sticky left) ── */
.row-label {
  width: var(--label-w); flex-shrink: 0;
  border-right: 1px solid var(--border-mid);
  display: flex; align-items: center; gap: 6px;
  padding: 0 10px 0 12px; position: relative;
  position: sticky; left: 0; z-index: 10;
  background: inherit;
}
.parent-row .row-label { background: var(--bg-card); }
.parent-row:hover .row-label { background: var(--bg-row-alt); }
.child-row .row-label { background: var(--bg-child); padding-left: 32px; }
.child-row:hover .row-label { background: var(--bg-hover); }

.row-label:hover .row-actions { opacity: 1; }

/* Toggle */
.toggle-btn {
  width: 18px; height: 18px; border: none; background: none;
  cursor: pointer; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-3); font-size: 9px;
  border-radius: 4px; transition: background .1s, color .1s;
}
.toggle-btn:hover { background: var(--border); color: var(--text-1); }
.toggle-chevron { transition: transform .22s cubic-bezier(.4,0,.2,1); display: inline-block; }
.toggle-btn.open .toggle-chevron { transform: rotate(90deg); }

/* Color stripe */
.color-stripe {
  width: 3px; height: 28px; border-radius: 2px;
  flex-shrink: 0; transition: opacity .15s;
}
.child-color-dot {
  width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
}

/* Label texts */
.label-texts { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.row-name {
  font-size: 13px; font-weight: 600; color: var(--text-1);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  padding: 2px 4px; border-radius: 4px; cursor: text; line-height: 1.4;
}
.row-sub {
  font-size: 11px; color: var(--text-3);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  padding: 1px 4px; cursor: text; line-height: 1.3;
}
.row-name:hover, .row-sub:hover { background: rgba(128,128,128,.1); }
.child-name-el {
  font-size: 12px; font-weight: 500; color: var(--text-2);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  padding: 2px 4px; border-radius: 4px; cursor: text; flex: 1; min-width: 0;
}
.child-name-el:hover { background: rgba(128,128,128,.1); }

/* Connector lines */
.connector-v {
  position: absolute; left: 20px; top: 0; bottom: 50%;
  width: 1px; background: var(--border-mid);
}
.connector-h {
  position: absolute; left: 20px; top: 50%;
  width: 10px; height: 1px; background: var(--border-mid);
}

/* Status badge */
.status-badge {
  font-family: var(--font-mono); font-size: 9px; font-weight: 500;
  padding: 2px 6px; border-radius: 10px; flex-shrink: 0;
  letter-spacing: .02em;
}
.s-planned   { background: #F1F0ED; color: #6B6560; }
.s-active    { background: #E4F5EC; color: #1A7C46; }
.s-review    { background: #FEF5E4; color: #8A5A00; }
.s-done      { background: #EBF2FD; color: #1E5AB5; }
.s-blocked   { background: #FEECEB; color: #B82B23; }
[data-theme="dark"] .s-planned { background: #2A2926; color: #8C8880; }
[data-theme="dark"] .s-active  { background: #0E2B1A; color: #4DB87A; }
[data-theme="dark"] .s-review  { background: #2A2010; color: #D4941A; }
[data-theme="dark"] .s-done    { background: #0E1F38; color: #5B9CF0; }
[data-theme="dark"] .s-blocked { background: #2A1110; color: #F06B65; }

/* Row actions */
.row-actions {
  display: flex; gap: 2px; opacity: 0; transition: opacity .15s; flex-shrink: 0;
}
.ra-btn {
  font-family: var(--font-ui); font-size: 10px; font-weight: 500;
  background: none; border: none; cursor: pointer;
  color: var(--text-3); padding: 3px 5px;
  border-radius: 4px; line-height: 1; white-space: nowrap;
  transition: all .1s;
}
.ra-btn:hover { background: var(--border); color: var(--text-1); }
.ra-btn.del:hover { background: #FEECEB; color: #B82B23; }
[data-theme="dark"] .ra-btn.del:hover { background: #2A1110; color: #F06B65; }
.ra-btn.add-ph { color: var(--accent); }
.ra-btn.add-ph:hover { background: var(--accent-soft); }

/* ── INLINE EDIT ── */
.inline-input {
  font-family: var(--font-ui); font-size: 13px; font-weight: 600;
  border: 1.5px solid var(--accent); border-radius: 4px;
  padding: 2px 6px; background: var(--bg-input); color: var(--text-1);
  outline: none; width: 100%;
}
.inline-input.sm { font-size: 12px; font-weight: 400; }

/* ── COLOR PICKER ── */
.cpop {
  display: none; position: absolute;
  left: calc(var(--label-w) + 4px); top: 50%; transform: translateY(-50%);
  z-index: 300; background: var(--bg-card);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-lg); padding: 10px 10px 8px;
  gap: 6px; flex-wrap: wrap; width: 196px;
  box-shadow: var(--shadow-lg);
}
.cpop-label { width: 100%; font-size: 10px; font-weight: 600; color: var(--text-3); letter-spacing: .08em; text-transform: uppercase; margin-bottom: 4px; }
.cdot {
  width: 20px; height: 20px; border-radius: 50%;
  cursor: pointer; border: 2px solid transparent;
  transition: transform .12s, border-color .12s; flex-shrink: 0;
}
.cdot:hover { transform: scale(1.2); }
.cdot.active { border-color: var(--text-1); }

/* ── TRACK ── */
.row-track {
  flex-shrink: 0; position: relative; overflow: visible;
}
.parent-row .row-track { height: var(--row-h); }
.child-row  .row-track { height: var(--sub-h); }

/* Stripes & grid lines */
.wk-stripe {
  position: absolute; top: 0; bottom: 0;
  background: var(--stripe); pointer-events: none; z-index: 0;
}
.grid-line {
  position: absolute; top: 0; bottom: 0;
  width: 1px; background: var(--border); pointer-events: none; z-index: 0;
  opacity: .5;
}
.today-line {
  position: absolute; top: 0; bottom: 0;
  width: 2px; background: var(--today-c);
  opacity: .6; z-index: 6; pointer-events: none;
}
.today-pill {
  position: absolute; top: -1px;
  background: var(--today-c); color: #fff;
  font-family: var(--font-mono); font-size: 9px;
  padding: 2px 5px; border-radius: 3px;
  transform: translateX(-50%); white-space: nowrap;
  pointer-events: none; z-index: 7;
}

/* ── PHASE BAR ── */
.phase-bar {
  position: absolute; border-radius: 6px;
  display: flex; align-items: center;
  font-size: 10px; font-weight: 600;
  white-space: nowrap; overflow: visible;
  cursor: grab; z-index: 3;
  transition: box-shadow .15s, filter .1s;
  letter-spacing: .01em;
}
.phase-bar:active { cursor: grabbing; }
.phase-bar.dragging {
  box-shadow: var(--shadow-lg); opacity: .88; z-index: 60;
  filter: brightness(1.05);
}

.bar-inner {
  display: flex; align-items: center;
  height: 100%; width: 100%;
  border-radius: 6px; overflow: hidden;
  position: relative;
}

/* Progress fill */
.bar-progress {
  position: absolute; left: 0; top: 0; bottom: 0;
  background: rgba(0,0,0,.12); pointer-events: none;
  border-radius: 6px 0 0 6px;
}

.bar-lbl {
  padding: 0 8px 0 10px; flex: 1;
  overflow: hidden; text-overflow: ellipsis;
  pointer-events: none; position: relative; z-index: 1;
}

/* Resize handles */
.rh {
  width: 9px; height: 100%; flex-shrink: 0;
  cursor: ew-resize; display: flex; align-items: center;
  justify-content: center; opacity: 0; transition: opacity .15s;
  position: relative; z-index: 2;
}
.rh::before {
  content: ''; display: block; width: 2px; height: 11px;
  background: rgba(255,255,255,.7); border-radius: 2px;
}
.phase-bar:hover .rh { opacity: 1; }
.rh.left::after, .rh.right::after { display: none; }

/* Summary bar */
.summary-bar {
  position: absolute; height: 4px; border-radius: 2px;
  bottom: 9px; opacity: .3; pointer-events: none; z-index: 1;
}

/* Milestone diamond */
.milestone {
  position: absolute; width: 14px; height: 14px;
  transform: rotate(45deg); z-index: 5;
  cursor: pointer; transition: transform .15s;
}
.milestone:hover { transform: rotate(45deg) scale(1.2); }

/* ── DEPENDENCY LINES (SVG overlay) ── */
.dep-svg {
  position: absolute; top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none; z-index: 2; overflow: visible;
}

/* ── TOOLTIPS ── */
.date-tip {
  position: fixed; background: var(--text-1); color: var(--bg-card);
  font-family: var(--font-mono); font-size: 11px;
  padding: 5px 10px; border-radius: 6px;
  pointer-events: none; z-index: 500; display: none; white-space: nowrap;
  box-shadow: var(--shadow-md);
}
.hover-card {
  position: fixed; background: var(--bg-card); color: var(--text-1);
  border: 1px solid var(--border-mid);
  border-radius: var(--radius-lg); padding: 12px 14px;
  pointer-events: none; z-index: 499; display: none;
  min-width: 210px; max-width: 260px;
  box-shadow: var(--shadow-lg); line-height: 1;
}
.hc-header { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.hc-dot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
.hc-title { font-size: 13px; font-weight: 600; color: var(--text-1); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hc-row { display: flex; justify-content: space-between; gap: 12px; padding: 4px 0; border-top: 1px solid var(--border); }
.hc-key { font-family: var(--font-mono); font-size: 10px; color: var(--text-3); }
.hc-val { font-family: var(--font-mono); font-size: 11px; color: var(--text-1); text-align: right; }
.hc-prog { margin-top: 8px; }
.hc-prog-bar { height: 4px; border-radius: 2px; background: var(--border); margin-top: 4px; overflow: hidden; }
.hc-prog-fill { height: 100%; border-radius: 2px; transition: width .3s; }

/* ── STATUS PANEL ── */
.statusbar {
  height: 28px; background: var(--bg-header);
  border-top: 1px solid var(--border);
  display: flex; align-items: center; padding: 0 16px; gap: 16px;
  font-size: 11px; color: var(--text-3); flex-shrink: 0;
}
.sb-item { display: flex; align-items: center; gap: 5px; }
.sb-dot { width: 6px; height: 6px; border-radius: 50%; }

/* ── MODAL ── */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.35); z-index: 800;
  display: flex; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none; transition: opacity .2s;
}
.modal-overlay.open { opacity: 1; pointer-events: all; }
.modal {
  background: var(--bg-card); border: 1px solid var(--border-mid);
  border-radius: var(--radius-xl); padding: 24px;
  width: 380px; box-shadow: var(--shadow-lg);
  transform: scale(.96); transition: transform .2s;
}
.modal-overlay.open .modal { transform: scale(1); }
.modal-title { font-size: 15px; font-weight: 700; margin-bottom: 16px; color: var(--text-1); }
.modal-field { margin-bottom: 14px; }
.modal-label { font-size: 11px; font-weight: 600; color: var(--text-3); letter-spacing: .07em; text-transform: uppercase; margin-bottom: 5px; }
.modal-input {
  width: 100%; padding: 8px 10px;
  border: 1px solid var(--border-mid); border-radius: var(--radius-md);
  background: var(--bg-input); color: var(--text-1);
  font-family: var(--font-ui); font-size: 13px; outline: none;
  transition: border-color .15s;
}
.modal-input:focus { border-color: var(--accent); }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }
.modal-select {
  width: 100%; padding: 7px 10px;
  border: 1px solid var(--border-mid); border-radius: var(--radius-md);
  background: var(--bg-input); color: var(--text-1);

/* ── SCROLLBAR ── */
.gantt-wrap::-webkit-scrollbar { width: 8px; height: 8px; }

<script>
/* ═══════════════════════════════════════════
   CONSTANTS & HELPERS
═══════════════════════════════════════════ */
const CHART_START = new Date('2025-01-01');
const CHART_END   = new Date('2025-12-31');
const TODAY       = new Date('2025-05-14');
const COL_W       = 14; // px per day

const PALETTE = [
  '#1E6AE1','#0E9E6E','#7B6EE0','#D95E2A','#B5821A',
  '#993060','#0E7A5A','#5040B0','#C02020','#1A8A9A',
  '#7A4A10','#2A60C0','#6A9A20','#C04080',
];

const STATUS_MAP = {
  planned: { label:'規劃中', cls:'s-planned' },
  active:  { label:'進行中', cls:'s-active' },
  review:  { label:'審核中', cls:'s-review' },
  done:    { label:'已完成', cls:'s-done' },
  blocked: { label:'已阻塞', cls:'s-blocked' },
};

let _uid = 1000;
function uid(){ return ++_uid }

function dFrom(base,d){ return Math.round((new Date(d)-new Date(base))/86400000) }
function addD(d,n){ const r=new Date(d); r.setDate(r.getDate()+n); return r }
function toISO(d){ return new Date(d).toISOString().slice(0,10) }
function fmtD(d){ return new Date(d).toLocaleDateString('zh-TW',{month:'2-digit',day:'2-digit'}) }
function fmtFull(d){ return new Date(d).toLocaleDateString('zh-TW',{year:'numeric',month:'2-digit',day:'2-digit'}) }
function lighten(hex,a=.55){
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${1-a})`;
}
function contrast(hex){
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return (.299*r+.587*g+.114*b)>145?'#1A1714':'#ffffff';
}

const totalDays = dFrom(CHART_START, CHART_END)+1;
const TRACK_W   = totalDays * COL_W;
const todayX    = dFrom(CHART_START, TODAY)*COL_W;

/* ── Calendar data ── */
function buildMonths(){
  const r=[],MN=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  let cur=new Date(CHART_START);
  while(cur<=CHART_END){
    const y=cur.getFullYear(),m=cur.getMonth();
    const s=new Date(Math.max(+new Date(y,m,1),+CHART_START));
    const e=new Date(Math.min(+new Date(y,m+1,0),+CHART_END));
    r.push({label:`${y} 年 ${MN[m]}`, days:dFrom(s,e)+1, m, y});
    cur=new Date(y,m+1,1);
  }
  return r;
}
function buildDays(){
  const r=[]; let d=new Date(CHART_START);
  while(d<=CHART_END){ r.push(new Date(d)); d.setDate(d.getDate()+1) }
  return r;
}

const months = buildMonths();
const allDays = buildDays();

/* ── Precompute stripe/grid HTML ── */
function buildGridHTML(){
  let s='';
  allDays.forEach((d,i)=>{
    const dow=d.getDay();
    if(dow===6){ // Sat start of weekend stripe
      s+=`<div class="wk-stripe" style="left:${i*COL_W}px;width:${COL_W*2}px"></div>`;
    }
    if(dow===1){ // Monday = week separator
      s+=`<div class="grid-line" style="left:${i*COL_W}px"></div>`;
    }
  });
  return s;
}
const GRID_HTML = buildGridHTML();

/* ═══════════════════════════════════════════
   DATA MODEL
═══════════════════════════════════════════ */
// Phase: { id, name, start, end, color, progress(0-100) }
// Child: { id, name, phases:[], status }
// Project: { id, name, dept, color, status, expanded, phases:[], children:[] }

    children:[]

let activeFilter = 'all';
let activeDrag   = null;
let ctxTarget    = null;

/* ═══════════════════════════════════════════
   RENDER
═══════════════════════════════════════════ */
function render(){
  const gantt = document.getElementById('ganttInner');

  // Filter
  const visible = activeFilter==='all'
    ? projects
    : projects.filter(p=>p.status===activeFilter);

  let h = '';

  /* ── Timeline header ── */
  h += `<div class="timeline-header">
    <div class="tl-label-cell">專案 / 階段</div>
    <div class="tl-grid" style="width:${TRACK_W}px">
      <div class="month-strip">`;
  months.forEach(mn=>{
    h+=`<div class="month-cell" style="width:${mn.days*COL_W}px">${mn.label}</div>`;
  });
  h+=`</div><div class="day-strip">`;
  allDays.forEach(d=>{
    const isT=d.toDateString()===TODAY.toDateString();
    const isM=d.getDay()===1, isWk=d.getDay()===0||d.getDay()===6;
    const lbl=(d.getDate()===1||isM)?d.getDate():'';
    h+=`<div class="day-cell${isM?' week-start':''}${isT?' is-today':''}${isWk?' is-weekend':''}" style="width:${COL_W}px">${lbl}</div>`;
  });
  h+=`</div>
    <div class="today-line" style="left:${todayX}px">
      <div class="today-pill">${fmtD(TODAY)}</div>
    </div>
  </div></div>`;

  /* ── Body ── */
  h += `<div class="gantt-body">`;

  if(!visible.length){
    h+=`<div class="empty-row">沒有符合條件的專案</div>`;
  }

  visible.forEach((proj)=>{
    const pi = projects.indexOf(proj);
    const st = STATUS_MAP[proj.status]||STATUS_MAP.planned;
    h += renderParentRow(proj, pi, st);
    h += `<div class="children-wrap${proj.expanded?'':' collapsed'}" id="cw-${proj.id}">`;
    proj.children.forEach((child, ci)=>{
      h += renderChildRow(child, pi, ci, proj);
    });
    h += `</div>`;
  });

  h += `</div>`;
  gantt.innerHTML = h;

  bindEvents();
  updateStatusBar();
}

function renderParentRow(proj, pi, st){
  const ph = proj.phases;
  // Summary bar span
  let sumBar = '';
  if(ph.length){
    const minS=new Date(Math.min(...ph.map(p=>+new Date(p.start))));
    const maxE=new Date(Math.max(...ph.map(p=>+new Date(p.end))));
    const sx=dFrom(CHART_START,minS)*COL_W;
    const sw=(dFrom(minS,maxE)+1)*COL_W;
    sumBar=`<div class="summary-bar" style="left:${sx}px;width:${sw}px;background:${proj.color}"></div>`;
  }

  return `
  <div class="proj-group" data-pi="${pi}" data-projid="${proj.id}">
    <div class="parent-row" data-pi="${pi}" data-projid="${proj.id}">
      <div class="row-label">
        <button class="toggle-btn${proj.expanded?' open':''}" data-pi="${pi}" data-projid="${proj.id}" title="${proj.expanded?'收合':'展開'}">
          <span class="toggle-chevron">▶</span>
        </button>
        <div class="color-stripe" style="background:${proj.color}"></div>
        <div class="label-texts">
          <div class="row-name editable" data-field="name" data-pi="${pi}">${proj.name}</div>
          <div class="row-sub editable" data-field="dept" data-pi="${pi}">${proj.dept}</div>
        </div>
        <span class="status-badge ${st.cls}">${st.label}</span>
        <div class="row-actions">
          <button class="ra-btn add-ph" data-pi="${pi}" title="新增階段">＋階段</button>
          <button class="ra-btn" data-action="addchild" data-pi="${pi}" title="新增子項目">＋子項</button>
          <button class="ra-btn" data-action="color" data-pi="${pi}" title="顏色">●</button>
          <button class="ra-btn del" data-action="delproj" data-pi="${pi}" title="刪除">✕</button>
        </div>
        <div class="cpop" id="cp-${proj.id}">
          <div class="cpop-label">選擇顏色</div>
          ${PALETTE.map(c=>`<div class="cdot${proj.color===c?' active':''}" style="background:${c}" data-color="${c}" data-pi="${pi}"></div>`).join('')}
        </div>
      </div>
      <div class="row-track" style="width:${TRACK_W}px" data-pi="${pi}">
        ${GRID_HTML}
        <div class="today-line" style="left:${todayX}px"></div>
        ${sumBar}
        ${ph.map((ph,phi)=>phaseBarHTML(ph,pi,'',phi,'parent')).join('')}
      </div>
    </div>`;
}

function renderChildRow(child, pi, ci, proj){
  const st = STATUS_MAP[child.status]||STATUS_MAP.planned;
  return `
    <div class="child-row" data-pi="${pi}" data-ci="${ci}" data-childid="${child.id}">
      <div class="row-label">
        <div class="connector-v"></div>
        <div class="connector-h"></div>
        <div class="child-color-dot" style="background:${proj.color}"></div>
        <div class="child-name-el editable-child" data-pi="${pi}" data-ci="${ci}">${child.name}</div>
        <span class="status-badge ${st.cls}" style="font-size:8px;padding:1px 5px">${st.label}</span>
        <div class="row-actions">
          <button class="ra-btn add-ph" data-pi="${pi}" data-ci="${ci}" title="新增階段">＋</button>
          <button class="ra-btn del" data-action="delchild" data-pi="${pi}" data-ci="${ci}" title="刪除子項">✕</button>
        </div>
      </div>
      <div class="row-track" style="width:${TRACK_W}px" data-pi="${pi}" data-ci="${ci}">
        ${GRID_HTML}
        <div class="today-line" style="left:${todayX}px"></div>
        ${child.phases.map((ph,phi)=>phaseBarHTML(ph,pi,ci,phi,'child')).join('')}
      </div>
    </div>`;
}

function phaseBarHTML(ph, pi, ci, phi, type){
  const lx  = dFrom(CHART_START, ph.start)*COL_W;
  const bw  = (dFrom(ph.start, ph.end)+1)*COL_W;
  const barH= type==='parent' ? 24 : 18;
  const barT= type==='parent' ? 13 : 13;
  const txt = contrast(ph.color);
  const prog= ph.progress||0;
  return `<div class="phase-bar"
    data-pi="${pi}" data-ci="${ci}" data-phi="${phi}" data-phid="${ph.id}"
    style="left:${lx}px;width:${bw}px;height:${barH}px;top:${barT}px;color:${txt}"
    title="${ph.name}">
    <div class="bar-inner" style="background:${ph.color}">
      <div class="bar-progress" style="width:${prog}%"></div>
      <div class="rh left" data-action="resize-left" data-pi="${pi}" data-ci="${ci}" data-phi="${phi}"></div>
      <div class="bar-lbl">${bw>48?ph.name:''}</div>
      <div class="rh right" data-action="resize-right" data-pi="${pi}" data-ci="${ci}" data-phi="${phi}"></div>
    </div>
  </div>`;
}

/* ═══════════════════════════════════════════
   STATUS BAR
═══════════════════════════════════════════ */
function updateStatusBar(){
  document.getElementById('sb-total').textContent = `${projects.length} 個專案`;
  document.getElementById('sb-active').textContent = `${projects.filter(p=>p.status==='active').length} 進行中`;
  document.getElementById('sb-done').textContent   = `${projects.filter(p=>p.status==='done').length} 已完成`;
  document.getElementById('sb-date').textContent   = `今天：${fmtFull(TODAY)}`;
}

/* ═══════════════════════════════════════════
   PHASE DATA ACCESS
═══════════════════════════════════════════ */
function getPhaseObj(pi, ci, phi){
  if(ci==='') return projects[pi].phases[phi];
  return projects[pi].children[+ci].phases[phi];
}
function setPhaseObj(pi, ci, phi, updates){
  const ph = getPhaseObj(pi,ci,phi);
  Object.assign(ph, updates);
}

/* ═══════════════════════════════════════════
   LIVE BAR UPDATE
═══════════════════════════════════════════ */
function liveUpdateBar(barEl){
  const {pi,ci,phi} = barEl.dataset;
  const ph = getPhaseObj(pi,ci,+phi);
  const lx = dFrom(CHART_START,ph.start)*COL_W;
  const bw = (dFrom(ph.start,ph.end)+1)*COL_W;
  barEl.style.left=lx+'px';
  barEl.style.width=bw+'px';
  const lbl=barEl.querySelector('.bar-lbl');
  if(lbl)lbl.textContent=bw>48?ph.name:'';
}

function refreshSummaryBar(pi){
  const proj=projects[pi];
  const row=document.querySelector(`.parent-row[data-pi="${pi}"] .row-track`);
  if(!row)return;
  const old=row.querySelector('.summary-bar');
  if(old)old.remove();
  if(!proj.phases.length)return;
  const minS=new Date(Math.min(...proj.phases.map(p=>+new Date(p.start))));
  const maxE=new Date(Math.max(...proj.phases.map(p=>+new Date(p.end))));
  const sx=dFrom(CHART_START,minS)*COL_W;
  const sw=(dFrom(minS,maxE)+1)*COL_W;
  const div=document.createElement('div');
  div.className='summary-bar';
  div.style.cssText=`left:${sx}px;width:${sw}px;background:${proj.color}`;
  row.appendChild(div);
}

/* ═══════════════════════════════════════════
   EVENTS
═══════════════════════════════════════════ */
const dateTip   = document.getElementById('dateTip');
const hoverCard = document.getElementById('hoverCard');

function bindEvents(){

  /* ── toggle collapse ── */
  document.querySelectorAll('.toggle-btn').forEach(btn=>{
    btn.addEventListener('click',e=>{
      e.stopPropagation();
      const pi=+btn.dataset.pi;
      const projid=btn.dataset.projid;
      projects[pi].expanded=!projects[pi].expanded;
      btn.classList.toggle('open', projects[pi].expanded);
      const wrap=document.getElementById(`cw-${projid}`);
      if(wrap) wrap.classList.toggle('collapsed', !projects[pi].expanded);
    });
  });

  /* ── inline edit: parent name/dept ── */
  document.querySelectorAll('.editable').forEach(el=>{
    el.addEventListener('dblclick',e=>startInlineEdit(el));
    el.addEventListener('click',e=>{ /* single click selects row */ });
  });

  document.querySelectorAll('.editable-child').forEach(el=>{
    el.addEventListener('dblclick',e=>startChildEdit(el));
  });

  /* ── add phase (parent) ── */
  document.querySelectorAll('.ra-btn.add-ph').forEach(btn=>{
    btn.addEventListener('click',e=>{
      e.stopPropagation();
      const pi=+btn.dataset.pi;
      const hasCi = btn.dataset.ci !== undefined;
      const ci = hasCi ? +btn.dataset.ci : null;
      const phases = ci===null ? projects[pi].phases : projects[pi].children[ci].phases;
      const color = projects[pi].color;
      const lastPh = phases[phases.length-1];
      const ns = lastPh ? toISO(addD(lastPh.end,1)) : toISO(TODAY);
      const ne = toISO(addD(new Date(ns),13));
      const colors=[projects[pi].color,'#7B6EE0','#B5821A','#0E9E6E','#D95E2A','#1A8A9A'];
      const c = colors[phases.length%colors.length];
      phases.push({id:uid(),name:`階段${phases.length+1}`,start:ns,end:ne,color:c,progress:0});
      render();
    });
  });

  /* ── add child ── */
  document.querySelectorAll('[data-action="addchild"]').forEach(btn=>{
    btn.addEventListener('click',e=>{
      e.stopPropagation();
      const pi=+btn.dataset.pi;
      projects[pi].expanded=true;
      const c=projects[pi].color;
      const newChild={id:uid(),name:'新子項目',status:'planned',phases:[
        {id:uid(),name:'一修',start:toISO(TODAY),end:toISO(addD(TODAY,13)),color:c,progress:0}
      ]};
      projects[pi].children.push(newChild);
      render();
      setTimeout(()=>{
        const all=document.querySelectorAll(`.editable-child[data-pi="${pi}"]`);
        if(all.length) startChildEdit(all[all.length-1]);
      },60);
    });
  });

  /* ── color picker ── */
  document.querySelectorAll('[data-action="color"]').forEach(btn=>{
    btn.addEventListener('click',e=>{
      e.stopPropagation();
      const pi=+btn.dataset.pi;
      const projid=projects[pi].id;
      const cp=document.getElementById(`cp-${projid}`);
      const open=cp.style.display==='flex';
      document.querySelectorAll('.cpop').forEach(c=>c.style.display='none');
      if(!open)cp.style.display='flex';
    });
  });
  document.querySelectorAll('.cdot').forEach(dot=>{
    dot.addEventListener('click',e=>{
      e.stopPropagation();
      projects[+dot.dataset.pi].color=dot.dataset.color;
      render();
    });
  });

  /* ── delete project ── */
  document.querySelectorAll('[data-action="delproj"]').forEach(btn=>{
    btn.addEventListener('click',e=>{
      e.stopPropagation();
      if(projects.length<=1)return;
      projects.splice(+btn.dataset.pi,1);
      render();
    });
  });

  /* ── delete child ── */
  document.querySelectorAll('[data-action="delchild"]').forEach(btn=>{
    btn.addEventListener('click',e=>{
      e.stopPropagation();
      projects[+btn.dataset.pi].children.splice(+btn.dataset.ci,1);
      render();
    });
  });

  /* ── close color pickers on outside click ── */
  document.addEventListener('click',()=>{
    document.querySelectorAll('.cpop').forEach(c=>c.style.display='none');
    closeCtxMenu();
  });

  /* ── right-click context menu ── */
  document.querySelectorAll('.parent-row').forEach(row=>{
    row.addEventListener('contextmenu',e=>{
      e.preventDefault(); e.stopPropagation();
      const pi=+row.dataset.pi;
      ctxTarget={type:'parent',pi};
      openCtxMenu(e.clientX,e.clientY);
    });
  });

  /* ── phase bar drag/resize ── */
  document.querySelectorAll('.phase-bar').forEach(bar=>{
    bar.addEventListener('mouseenter',e=>{ if(!activeDrag) showHoverCard(e,bar) });
    bar.addEventListener('mousemove', e=>{ if(!activeDrag) moveHoverCard(e) });
    bar.addEventListener('mouseleave',()=>{ hoverCard.style.display='none' });

    bar.addEventListener('mousedown',e=>{
      const action=e.target.dataset.action;
      if(action==='resize-left'||action==='resize-right'){
        startResize(e,bar,action);
      } else if(!e.target.classList.contains('rh')){
        startMove(e,bar);
      }
    });
  });
}

/* ── Drag: Move ── */
function startMove(e,bar){
  e.preventDefault(); hoverCard.style.display='none';
  const {pi,ci,phi} = bar.dataset;
  const ph = getPhaseObj(pi,ci,+phi);
  const origStart=new Date(ph.start), origEnd=new Date(ph.end);
  const dur=dFrom(origStart,origEnd), startX=e.clientX;
  activeDrag={bar,origStart,origEnd,dur,startX};
  bar.classList.add('dragging');

  function onMove(ev){
    const dd=Math.round((ev.clientX-startX)/COL_W);
    let ns=addD(origStart,dd);
    if(ns<CHART_START)ns=new Date(CHART_START);
    let ne=addD(ns,dur);
    if(ne>CHART_END){ne=new Date(CHART_END);ns=addD(ne,-dur);}
    setPhaseObj(pi,ci,+phi,{start:toISO(ns),end:toISO(ne)});
    liveUpdateBar(bar);
    if(ci==='')refreshSummaryBar(+pi);
    showDateTip(ev,pi,ci,+phi);
  }
  function onUp(){
    activeDrag=null; dateTip.style.display='none';
    bar.classList.remove('dragging');
    doc.removeEventListener('mousemove',onMove);
    doc.removeEventListener('mouseup',onUp);
  }
  doc.addEventListener('mousemove',onMove);
  doc.addEventListener('mouseup',onUp);
}

/* ── Drag: Resize ── */
function startResize(e,bar,action){
  e.preventDefault(); e.stopPropagation(); hoverCard.style.display='none';
  const {pi,ci,phi} = bar.dataset;
  const ph = getPhaseObj(pi,ci,+phi);
  const origStart=new Date(ph.start), origEnd=new Date(ph.end), startX=e.clientX;
  activeDrag={bar,origStart,origEnd,startX,action};
  bar.classList.add('dragging');

  function onMove(ev){
    const dd=Math.round((ev.clientX-startX)/COL_W);
    if(action==='resize-left'){
      let ns=addD(origStart,dd);
      if(ns>=origEnd)ns=addD(origEnd,-1);
      if(ns<CHART_START)ns=new Date(CHART_START);
      setPhaseObj(pi,ci,+phi,{start:toISO(ns)});
    } else {
      let ne=addD(origEnd,dd);
      if(ne<=origStart)ne=new Date(origStart);
      if(ne>CHART_END)ne=new Date(CHART_END);
      setPhaseObj(pi,ci,+phi,{end:toISO(ne)});
    }
    liveUpdateBar(bar);
    if(ci==='')refreshSummaryBar(+pi);
    showDateTip(ev,pi,ci,+phi);
  }
  function onUp(){
    activeDrag=null; dateTip.style.display='none';
    bar.classList.remove('dragging');
    doc.removeEventListener('mousemove',onMove);
    doc.removeEventListener('mouseup',onUp);
  }
  doc.addEventListener('mousemove',onMove);
  doc.addEventListener('mouseup',onUp);
}

const doc = document;

/* ── Tooltip ── */
function showDateTip(e,pi,ci,phi){
  const ph=getPhaseObj(pi,ci,phi);
  const dur=dFrom(ph.start,ph.end)+1;
  dateTip.textContent=`${ph.start}  ▶  ${ph.end}  ·  ${dur} 天`;
  dateTip.style.display='block';
  dateTip.style.left=Math.min(e.clientX+14,window.innerWidth-220)+'px';
  dateTip.style.top=(e.clientY-38)+'px';
}

function showHoverCard(e,bar){
  const {pi,ci,phi}=bar.dataset;
  const ph=getPhaseObj(pi,ci,+phi);
  const proj=projects[+pi];
  const ctxName = ci==='' ? proj.name : proj.children[+ci].name;
  const dur=dFrom(ph.start,ph.end)+1;
  const prog=ph.progress||0;
  hoverCard.innerHTML=`
    <div class="hc-header">
      <div class="hc-dot" style="background:${ph.color}"></div>
      <div class="hc-title">${ctxName}</div>
    </div>
    <div class="hc-row"><span class="hc-key">階段</span><span class="hc-val">${ph.name}</span></div>
    <div class="hc-row"><span class="hc-key">開始</span><span class="hc-val">${ph.start}</span></div>
    <div class="hc-row"><span class="hc-key">結束</span><span class="hc-val">${ph.end}</span></div>
    <div class="hc-row"><span class="hc-key">天數</span><span class="hc-val">${dur} 天</span></div>
    <div class="hc-prog">
      <div style="display:flex;justify-content:space-between;margin-bottom:3px">
        <span class="hc-key">進度</span><span class="hc-val">${prog}%</span>
      </div>
      <div class="hc-prog-bar"><div class="hc-prog-fill" style="width:${prog}%;background:${ph.color}"></div></div>
    </div>`;
  hoverCard.style.display='block';
  moveHoverCard(e);
}
function moveHoverCard(e){
  hoverCard.style.left=Math.min(e.clientX+18,window.innerWidth-230)+'px';
  hoverCard.style.top=Math.min(e.clientY-10,window.innerHeight-200)+'px';
}

/* ── Inline edit ── */
function startInlineEdit(el){
  if(el.querySelector('input'))return;
  const pi=+el.dataset.pi, field=el.dataset.field;
  const cur = field==='name'?projects[pi].name:projects[pi].dept;
  const inp=document.createElement('input');
  inp.className='inline-input'+(field==='dept'?' sm':'');
  inp.value=cur;
  el.textContent=''; el.appendChild(inp);
  inp.focus(); inp.select();
  function commit(){
    const v=inp.value.trim()||cur;
    if(field==='name')projects[pi].name=v; else projects[pi].dept=v;
    render();
  }
  inp.addEventListener('blur',commit);
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter')commit(); if(e.key==='Escape')render(); });
}

function startChildEdit(el){
  if(el.querySelector('input'))return;
  const pi=+el.dataset.pi, ci=+el.dataset.ci;
  const cur=projects[pi].children[ci].name;
  const inp=document.createElement('input');
  inp.className='inline-input sm';
  inp.value=cur;
  el.textContent=''; el.appendChild(inp);
  inp.focus(); inp.select();
  function commit(){
    const v=inp.value.trim()||cur;
    projects[pi].children[ci].name=v;
    render();
  }
  inp.addEventListener('blur',commit);
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter')commit(); if(e.key==='Escape')render(); });
}

/* ── Context menu ── */
function openCtxMenu(x,y){
  const m=document.getElementById('ctxMenu');
  m.classList.add('open');
  m.style.left=Math.min(x,window.innerWidth-180)+'px';
  m.style.top=Math.min(y,window.innerHeight-220)+'px';
}
function closeCtxMenu(){
  document.getElementById('ctxMenu').classList.remove('open');
}
document.getElementById('ctx-edit').addEventListener('click',()=>{
  if(!ctxTarget)return;
  const el=document.querySelector(`.row-name[data-pi="${ctxTarget.pi}"]`);
  if(el)startInlineEdit(el);
  closeCtxMenu();
});
document.getElementById('ctx-addphase').addEventListener('click',()=>{
  if(!ctxTarget)return;
  const btn=document.querySelector(`.ra-btn.add-ph[data-pi="${ctxTarget.pi}"]:not([data-ci])`);
  if(btn)btn.click();
  closeCtxMenu();
});
document.getElementById('ctx-addchild').addEventListener('click',()=>{
  if(!ctxTarget)return;
  const btn=document.querySelector(`[data-action="addchild"][data-pi="${ctxTarget.pi}"]`);
  if(btn)btn.click();
  closeCtxMenu();
});
document.getElementById('ctx-color').addEventListener('click',()=>{
  if(!ctxTarget)return;
  const btn=document.querySelector(`[data-action="color"][data-pi="${ctxTarget.pi}"]`);
  if(btn)btn.click();
  closeCtxMenu();
});
document.getElementById('ctx-status').addEventListener('click',()=>{
  if(!ctxTarget)return;
  const pi=ctxTarget.pi;
  const keys=Object.keys(STATUS_MAP);
  const cur=keys.indexOf(projects[pi].status);
  projects[pi].status=keys[(cur+1)%keys.length];
  render();
  closeCtxMenu();
});
document.getElementById('ctx-delete').addEventListener('click',()=>{
  if(!ctxTarget||projects.length<=1)return;
  projects.splice(ctxTarget.pi,1);
  render();
  closeCtxMenu();
});

/* ── Filter ── */
document.querySelectorAll('[data-filter]').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('[data-filter]').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    activeFilter=btn.dataset.filter;
    render();
  });
});
document.querySelector('[data-filter="all"]').classList.add('active');

/* ── Collapse all / Expand all ── */
document.getElementById('collapseAllBtn').addEventListener('click',()=>{
  projects.forEach(p=>p.expanded=false);
  render();
});
document.getElementById('expandAllBtn').addEventListener('click',()=>{
  projects.forEach(p=>p.expanded=true);
  render();
});

/* ── Jump to today ── */
document.getElementById('todayBtn').addEventListener('click',()=>{
  const wrap=document.getElementById('ganttWrap');
  const target=todayX+260-window.innerWidth/2;
  wrap.scrollTo({left:Math.max(0,target),behavior:'smooth'});
});

/* ── Add project modal ── */
(function(){
  const modal   = document.getElementById('addModal');
  const cGrid   = document.getElementById('m-colorGrid');
  let selColor  = PALETTE[0];

  // build color grid
  PALETTE.forEach(c=>{
    const d=document.createElement('div');
    d.className='cdot'+(c===selColor?' active':'');
    d.style.background=c;
    d.addEventListener('click',()=>{
      selColor=c;
      cGrid.querySelectorAll('.cdot').forEach(x=>x.classList.remove('active'));
      d.classList.add('active');
    });
    cGrid.appendChild(d);
  });

  function openModal(){ modal.classList.add('open'); document.getElementById('m-name').focus(); }
  function closeModal(){ modal.classList.remove('open'); }

  document.getElementById('addProjBtn').addEventListener('click', openModal);
  document.getElementById('m-cancel').addEventListener('click', closeModal);
  modal.addEventListener('click',e=>{ if(e.target===modal)closeModal(); });

  document.getElementById('m-confirm').addEventListener('click',()=>{
    const name=document.getElementById('m-name').value.trim()||'新專案';
    const dept=document.getElementById('m-dept').value.trim()||'未指定';
    const status=document.getElementById('m-status').value;
    projects.push({
      id:uid(), name, dept, color:selColor, status, expanded:true,
      phases:[{id:uid(),name:'一修',start:toISO(TODAY),end:toISO(addD(TODAY,13)),color:selColor,progress:0}],
      children:[]
    });
    document.getElementById('m-name').value='';
    document.getElementById('m-dept').value='';
    closeModal();
    render();
    setTimeout(()=>document.getElementById('ganttWrap').scrollTo({top:99999,behavior:'smooth'}),100);
  });
})();

/* ── Theme toggle ── */
document.getElementById('themeBtn').addEventListener('click',()=>{
  const html=document.documentElement;
  html.dataset.theme=html.dataset.theme==='dark'?'light':'dark';
  document.querySelector('.theme-toggle-icon').textContent=
    html.dataset.theme==='dark'?'☽':'☀';
});

/* ── Shortcut HUD ── */
const shud=document.getElementById('shortcutHud');
document.getElementById('shortcutBtn').addEventListener('click',e=>{
  e.stopPropagation();
  shud.classList.toggle('show');
});
document.addEventListener('click',()=>shud.classList.remove('show'));

/* ── Export (print) ── */
document.getElementById('exportBtn').addEventListener('click',()=>{
  window.print();
});

/* ── Share (copy URL) ── */
document.getElementById('shareBtn').addEventListener('click',()=>{
  navigator.clipboard.writeText(window.location.href).catch(()=>{});
  const btn=document.getElementById('shareBtn');
  btn.textContent='✓ 已複製';
  setTimeout(()=>btn.textContent='↗ 分享',1500);
});

/* ── Keyboard shortcuts ── */
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT') return;
  switch(e.key){
    case 'n': case 'N': document.getElementById('addProjBtn').click(); break;
    case 't': case 'T': document.getElementById('todayBtn').click(); break;
    case 'd': case 'D': document.getElementById('themeBtn').click(); break;
    case 'e': case 'E': document.getElementById('expandAllBtn').click(); break;
    case 'c': case 'C': document.getElementById('collapseAllBtn').click(); break;
    case '?': shud.classList.toggle('show'); break;
    case 'Escape':
      shud.classList.remove('show');
      document.querySelectorAll('.cpop').forEach(x=>x.style.display='none');
      document.getElementById('addModal').classList.remove('open');
      break;
  }
});

/* ── Auto-scroll to today on load ── */
window.addEventListener('load',()=>{
  setTimeout(()=>{
    const wrap=document.getElementById('ganttWrap');
    const target=todayX+260-window.innerWidth/2;
    wrap.scrollLeft=Math.max(0,target);
  },200);
});

/* ── INIT ── */
render();
</script>
